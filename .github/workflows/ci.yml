name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Configure git identity for integration tests
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global core.autocrlf false

      - run: npm ci
      - run: npm run compile
      - run: npm run lint
      - run: npm run test:unit

      - name: VS Code host smoke tests (Linux, under Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:vscode

      - name: VS Code host smoke tests (macOS / Windows)
        if: runner.os != 'Linux'
        run: npm run test:vscode

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci
      - run: npm run compile
      - name: Package VSIX
        run: npx --yes @vscode/vsce package --allow-missing-repository --out git-workspace-pro.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: git-workspace-pro-vsix
          path: git-workspace-pro.vsix
          if-no-files-found: error
